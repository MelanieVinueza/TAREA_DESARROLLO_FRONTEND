name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check server.js
      - name: Smoke test static server
        run: |
          node server.js > /tmp/frontend-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:5173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:5173/app.js > /dev/null
          curl --fail --silent http://localhost:5173/styles.css > /dev/null
